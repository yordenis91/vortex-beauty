<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mockups del manual de Afilao</title>
<style>
  :root { --rojo:#e11d48; --tinta:#1f2937; --gris:#6b7280; --borde:#e5e7eb; }
  * { box-sizing:border-box; }
  body { margin:0; padding:24px; background:#e9ecef; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; color:var(--tinta); }
  h1 { font-size:20px; margin:0 0 4px; } p.nota { margin:0 0 24px; color:var(--gris); font-size:14px; }
  figure { margin:0 0 40px; } figcaption { margin-top:10px; font-size:14px; color:var(--gris); max-width:560px; }
  .lienzo { position:relative; display:inline-block; }
  /* anotaciones */
  .caja { position:absolute; border:3px solid var(--rojo); border-radius:10px; box-shadow:0 0 0 2px rgba(255,255,255,.8); pointer-events:none; }
  .pin { position:absolute; width:26px; height:26px; border-radius:50%; background:var(--rojo); color:#fff; font:700 14px/26px system-ui,sans-serif; text-align:center; box-shadow:0 0 0 2px #fff,0 1px 4px rgba(0,0,0,.4); }
  svg.flechas { position:absolute; inset:0; width:100%; height:100%; pointer-events:none; overflow:visible; }
  /* captura 15: cartel */
  .cartel { width:540px; height:750px; background:#fff; border:1px solid var(--borde); font-family:system-ui,"Segoe UI",Helvetica,Arial,sans-serif; text-align:center; }
  .cartel .banda { height:160px; background:#ff6b57; color:#111; display:flex; align-items:center; justify-content:center; font-size:40px; font-weight:700; }
  .cartel .sub { margin-top:36px; font-size:23px; color:#333; }
  .cartel .marco { margin:26px auto 0; width:350px; height:350px; border:4px solid #ff6b57; border-radius:14px; padding:15px; background:#fff; }
  .cartel .marco svg { width:100%; height:100%; display:block; }
  .cartel .ayuda { margin-top:22px; font-size:17px; color:#555; }
  .cartel .url { margin-top:8px; font-size:19px; font-weight:600; color:#111; }
  .cartel .pie { margin-top:14px; font-size:12px; color:#888; }
  /* captura 24: chat de Telegram */
  .tel { width:390px; background:#e6ebee; border-radius:22px; overflow:hidden; border:1px solid #cbd2d6; font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; }
  .tel .barra { background:#3390ec; color:#fff; padding:12px 16px; display:flex; align-items:center; gap:10px; }
  .tel .avatar { width:36px; height:36px; border-radius:50%; background:#14213d; display:flex; align-items:center; justify-content:center; font-weight:700; }
  .tel .barra b { display:block; font-size:15px; } .tel .barra small { opacity:.85; font-size:12px; }
  .tel .chat { padding:14px 12px 18px; display:flex; flex-direction:column; gap:8px; min-height:540px; }
  .burbuja { max-width:84%; padding:8px 11px; border-radius:14px; font-size:14px; line-height:1.4; white-space:pre-line; box-shadow:0 1px 1px rgba(0,0,0,.08); }
  .yo { align-self:flex-end; background:#d9fdd3; border-bottom-right-radius:4px; }
  .bot { align-self:flex-start; background:#fff; border-bottom-left-radius:4px; }
  .hora { display:block; text-align:right; font-size:11px; color:#8a9199; margin-top:2px; }
  .campo { background:#fff; padding:10px 14px; color:#8a9199; font-size:14px; border-top:1px solid #d6dbdf; }
</style></head>

<script>
// Dibuja los recuadros rojos y los números sobre los elementos marcados con data-n.
document.querySelectorAll('.lienzo').forEach((lienzo) => {
  const base = lienzo.getBoundingClientRect();
  lienzo.querySelectorAll('[data-n]').forEach((el) => {
    const r = el.getBoundingClientRect(), pad = Number(el.dataset.pad || 4);
    const caja = document.createElement('div'); caja.className = 'caja';
    Object.assign(caja.style, { left: (r.left - base.left - pad) + 'px', top: (r.top - base.top - pad) + 'px', width: (r.width + pad * 2) + 'px', height: (r.height + pad * 2) + 'px' });
    const pin = document.createElement('div'); pin.className = 'pin'; pin.textContent = el.dataset.n;
    const right = (el.dataset.side || '').includes('r');
    Object.assign(pin.style, { left: ((right ? r.right - base.left + pad : r.left - base.left - pad) - 13) + 'px', top: (r.top - base.top - pad - 13) + 'px' });
    lienzo.append(caja, pin);
  });
});
