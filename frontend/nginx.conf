# Caché de lo que se reenvía al API (manifiesto e iconos de cada salón): el navegador pide el manifiesto en cada visita
# y, como todas estas peticiones llegan al API desde el mismo servidor, sin caché agotarían su límite de consultas.
proxy_cache_path /var/cache/nginx/pwa levels=1:2 keys_zone=pwa:1m max_size=20m inactive=1h;

server {
    listen 80;

    # Cabeceras de seguridad. No hay CSP estricta: Turnstile (reserva pública) carga un script externo.
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css text/javascript application/javascript application/json image/svg+xml;

    # Archivos con hash en el nombre: caché larga
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PWA: el service worker y el manifiesto nunca se cachean (así las actualizaciones llegan) y el manifiesto lleva su tipo correcto.
    location ~ ^/(sw\.js|registerSW\.js|workbox-[\w-]+\.js)$ {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /manifest.webmanifest {
        root /usr/share/nginx/html;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Página de aterrizaje: solo la raíz exacta. El resto de rutas sigue siendo la app (SPA).
    location = / {
        root /usr/share/nginx/html;
        try_files /landing.html =404;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # Imágenes de la landing: caché de un día (el nombre no cambia al actualizar una captura)
    location /landing/ {
        root /usr/share/nginx/html;
        expires 1d;
        add_header Cache-Control "public";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # PWA por salón: el manifiesto y los iconos de /<salón>/ los genera el API. Se reenvían desde aquí porque el
    # navegador solo instala una página si su manifiesto sale de su mismo dominio.
    # __API_ORIGIN__ y __API_HOST__ los pone el Dockerfile al construir, a partir de VITE_API_BASE_URL.
    location ~ ^/(?<pwa_slug>[a-z0-9-]+)/manifest\.webmanifest$ {
        resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
        set $pwa_api "__API_ORIGIN__";
        proxy_pass $pwa_api/api/public/booking/$pwa_slug/manifest;
        include /etc/nginx/pwa_proxy.conf;
        default_type application/manifest+json;
    }

    location ~ ^/(?<pwa_slug>[a-z0-9-]+)/pwa-icon-(?<pwa_icon>192|512|maskable-512|apple-180)\.png$ {
        resolver 127.0.0.11 1.1.1.1 valid=300s ipv6=off;
        set $pwa_api "__API_ORIGIN__";
        proxy_pass $pwa_api/api/public/booking/$pwa_slug/icon/$pwa_icon.png;
        include /etc/nginx/pwa_proxy.conf;
    }

    location / {
        root   /usr/share/nginx/html;
        index  index.html index.htm;
        # La app es de una sola página: cualquier ruta devuelve index.html
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    error_page   500 502 503 504  /50x.html;
    location = /50x.html {
        root   /usr/share/nginx/html;
    }
}
